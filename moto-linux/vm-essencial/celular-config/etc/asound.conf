# Saída padrão com volume próprio ("Master", em amixer) e conversão automática de formato.
# shortcut: sem dmix (o timer de áudio deste kernel 3.10 trava o dmix), então um programa por vez toca; para misturar, usar PipeWire.
pcm.!default { type plug; slave.pcm "volume" }
pcm.volume { type softvol; slave.pcm "hw:0,0"; control { name "Master"; card 0 } }
ctl.!default { type hw; card 0 }
